<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GetTranscript — Store artwork</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1280px;
        height: 800px;
        overflow: hidden;
        background: #f3f7ff;
        color: #101b2f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 80px;
        padding: 70px 80px;
      }
      article {
        flex: 1;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 15px;
        font-size: 25px;
        font-weight: 750;
        margin-bottom: 42px;
      }
      .brand img {
        width: 48px;
        height: 48px;
      }
      h1 {
        font-size: 49px;
        line-height: 1.12;
        letter-spacing: -1.8px;
        margin: 0 0 24px;
      }
      p {
        font-size: 20px;
        line-height: 1.65;
        color: #566477;
        max-width: 480px;
        margin: 0;
      }
      .formats {
        margin: 35px 0 28px;
        color: #2563eb;
        font-size: 20px;
        font-weight: 650;
        letter-spacing: 1px;
      }
      .privacy {
        font-size: 16px;
      }
      iframe {
        flex-shrink: 0;
        width: 400px;
        height: 600px;
        border: 0;
        border-radius: 14px;
        background: white;
        box-shadow:
          0 18px 70px #203b6b22,
          0 0 0 1px #203b6b0c;
      }
    </style>
  </head>
  <body>
    <main>
      <article>
        <div class="brand">
          <img src="/icons/icon128.png" alt="" />GetTranscript
        </div>
        <h1>Keep the transcript.<br />Keep the speaker names.</h1>
        <p>
          Export available captions from Microsoft Stream and supported video
          players.
        </p>
        <div class="formats">VTT · SRT · TXT · Markdown · JSON</div>
        <p class="privacy">
          Processed on your device.<br />No account. No cloud upload.
        </p>
      </article>
      <iframe
        src="/?demo"
        title="GetTranscript export popup with fictional meeting content"
      ></iframe>
    </main>
  </body>
</html>
